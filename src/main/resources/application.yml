spring:
  application:
    name: inventory
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=inventory;encrypt=true;trustServerCertificate=true
    username: user
    password: yesh@6289
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

grpc:
  server:
    port: 9090
  client:
    my-service:
        address: static://localhost:9090
        enable-keepalive: true
        negotiation-type: plaintext
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi/openapi.yml
server:
  port: 8081